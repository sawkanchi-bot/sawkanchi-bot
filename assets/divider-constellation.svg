<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Line -->
  <line x1="100" y1="30" x2="1100" y2="30" stroke="url(#divGrad)" stroke-width="1">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Constellation Nodes -->
  <g filter="url(#divGlow)">
    <circle cx="300" cy="30" r="3" fill="#E6B8FF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="25" r="2" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="600" cy="30" r="4" fill="#ffffff">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="35" r="2" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="900" cy="30" r="3" fill="#B8D4FF">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="r" values="3;4;3" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>
  
  <!-- Connecting Lines -->
  <g stroke="#E6B8FF" stroke-width="0.5" opacity="0.3">
    <line x1="300" y1="30" x2="450" y2="25">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="450" y1="25" x2="600" y2="30">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="600" y1="30" x2="750" y2="35">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="750" y1="35" x2="900" y2="30">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </line>
  </g>
</svg>

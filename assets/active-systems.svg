<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 350" width="100%">
  <defs>
    <linearGradient id="asBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="card1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="100%" style="stop-color:#c49ee0"/>
    </linearGradient>
    <linearGradient id="card2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#e0a0b8"/>
    </linearGradient>
    <linearGradient id="card3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8D4FF"/>
      <stop offset="100%" style="stop-color:#9cb8e0"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#asBg)"/>
  
  <!-- Background Particles -->
  <g fill="#ffffff" opacity="0.2">
    <circle cx="100" cy="50" r="1"><animate attributeName="opacity" values="0.1;0.4;0.1" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="30" r="0.8"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="4s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="900" cy="60" r="1"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="320" r="0.8"><animate attributeName="opacity" values="0.2;0.4;0.2" dur="4.5s" repeatCount="indefinite" begin="2s"/></circle>
    <circle cx="800" cy="300" r="1"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="5.5s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Project Card 1: AI Automation Platform -->
  <g transform="translate(50, 40)">
    <!-- Card Background -->
    <rect width="280" height="260" rx="12" fill="#1a1a2e" stroke="url(#card1Grad)" stroke-width="1.5" filter="url(#cardShadow)">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="4s" repeatCount="indefinite"/>
    </rect>
    
    <!-- Status Indicator -->
    <circle cx="255" cy="25" r="6" fill="#6bcb77">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Module Icon -->
    <g transform="translate(25, 25)">
      <rect width="40" height="40" rx="8" fill="#2d1f3d"/>
      <circle cx="20" cy="20" r="12" fill="none" stroke="#E6B8FF" stroke-width="2">
        <animate attributeName="r" values="12;14;12" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="20" cy="20" r="5" fill="#E6B8FF">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Title -->
    <text x="80" y="45" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E6B8FF" font-weight="600">AI Automation Platform</text>
    <text x="80" y="62" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">Intelligent workflow orchestration</text>
    
    <!-- Description -->
    <text x="25" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">Multi-agent system for automating</text>
    <text x="25" y="118" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">complex business workflows using</text>
    <text x="25" y="136" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">LLM-powered decision engines.</text>
    
    <!-- Tech Tags -->
    <g transform="translate(25, 155)">
      <rect width="55" height="20" rx="4" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="0.5"/>
      <text x="27" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E6B8FF">Python</text>
      
      <rect x="62" width="65" height="20" rx="4" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="0.5"/>
      <text x="94" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E6B8FF">LangChain</text>
      
      <rect x="134" width="45" height="20" rx="4" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="0.5"/>
      <text x="156" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#E6B8FF">GPT-4</text>
    </g>
    
    <!-- Metrics -->
    <g transform="translate(25, 195)">
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="0">▸ Agents deployed:</tspan>
        <tspan fill="#E6B8FF"> 12</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="18">▸ Tasks automated:</tspan>
        <tspan fill="#E6B8FF"> 2.4K/day</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="18">▸ Accuracy:</tspan>
        <tspan fill="#6bcb77"> 98.7%</tspan>
      </text>
    </g>
  </g>
  
  <!-- Project Card 2: SaaS Analytics Engine -->
  <g transform="translate(360, 40)">
    <rect width="280" height="260" rx="12" fill="#1a1a2e" stroke="url(#card2Grad)" stroke-width="1.5" filter="url(#cardShadow)">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    
    <circle cx="255" cy="25" r="6" fill="#6bcb77">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    
    <g transform="translate(25, 25)">
      <rect width="40" height="40" rx="8" fill="#3d1f2d"/>
      <path d="M 12 28 L 20 18 L 28 23 L 20 12" fill="none" stroke="#FFB8D4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <animate attributeName="stroke-dasharray" values="0,100;50,0" dur="2s" repeatCount="indefinite"/>
      </path>
    </g>
    
    <text x="80" y="45" font-family="'Segoe UI', sans-serif" font-size="14" fill="#FFB8D4" font-weight="600">SaaS Analytics Engine</text>
    <text x="80" y="62" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">Real-time data intelligence</text>
    
    <text x="25" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">High-performance analytics platform</text>
    <text x="25" y="118" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">processing billions of events with</text>
    <text x="25" y="136" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">sub-second query responses.</text>
    
    <g transform="translate(25, 155)">
      <rect width="45" height="20" rx="4" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="0.5"/>
      <text x="22" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#FFB8D4">Go</text>
      
      <rect x="52" width="70" height="20" rx="4" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="0.5"/>
      <text x="87" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#FFB8D4">ClickHouse</text>
      
      <rect x="129" width="50" height="20" rx="4" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="0.5"/>
      <text x="154" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#FFB8D4">Kafka</text>
    </g>
    
    <g transform="translate(25, 195)">
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="0">▸ Events/sec:</tspan>
        <tspan fill="#FFB8D4"> 500K+</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="18">▸ Latency P99:</tspan>
        <tspan fill="#FFB8D4"> 23ms</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="18">▸ Uptime:</tspan>
        <tspan fill="#6bcb77"> 99.99%</tspan>
      </text>
    </g>
  </g>
  
  <!-- Project Card 3: Intelligent API Gateway -->
  <g transform="translate(670, 40)">
    <rect width="280" height="260" rx="12" fill="#1a1a2e" stroke="url(#card3Grad)" stroke-width="1.5" filter="url(#cardShadow)">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite" begin="1s"/>
    </rect>
    
    <circle cx="255" cy="25" r="6" fill="#6bcb77">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    
    <g transform="translate(25, 25)">
      <rect width="40" height="40" rx="8" fill="#1f2d3d"/>
      <circle cx="20" cy="20" r="8" fill="none" stroke="#B8D4FF" stroke-width="2"/>
      <line x1="8" y1="20" x2="14" y2="20" stroke="#B8D4FF" stroke-width="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </line>
      <line x1="26" y1="20" x2="32" y2="20" stroke="#B8D4FF" stroke-width="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
      </line>
      <line x1="20" y1="8" x2="20" y2="14" stroke="#B8D4FF" stroke-width="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="1s"/>
      </line>
      <line x1="20" y1="26" x2="20" y2="32" stroke="#B8D4FF" stroke-width="2">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" begin="0.75s"/>
      </line>
    </g>
    
    <text x="80" y="45" font-family="'Segoe UI', sans-serif" font-size="14" fill="#B8D4FF" font-weight="600">Intelligent API Gateway</text>
    <text x="80" y="62" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">ML-powered traffic management</text>
    
    <text x="25" y="100" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">Smart gateway with predictive</text>
    <text x="25" y="118" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">rate limiting, anomaly detection,</text>
    <text x="25" y="136" font-family="'Segoe UI', sans-serif" font-size="11" fill="#c9d1d9">and auto-scaling capabilities.</text>
    
    <g transform="translate(25, 155)">
      <rect width="45" height="20" rx="4" fill="#1f2d3d" stroke="#B8D4FF" stroke-width="0.5"/>
      <text x="22" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#B8D4FF">Rust</text>
      
      <rect x="52" width="45" height="20" rx="4" fill="#1f2d3d" stroke="#B8D4FF" stroke-width="0.5"/>
      <text x="74" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#B8D4FF">Redis</text>
      
      <rect x="104" width="65" height="20" rx="4" fill="#1f2d3d" stroke="#B8D4FF" stroke-width="0.5"/>
      <text x="136" y="14" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="9" fill="#B8D4FF">TensorRT</text>
    </g>
    
    <g transform="translate(25, 195)">
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="0">▸ Requests/sec:</tspan>
        <tspan fill="#B8D4FF"> 1.2M</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="18">▸ Threat blocked:</tspan>
        <tspan fill="#B8D4FF"> 45K/hr</tspan>
      </text>
      <text font-family="'Courier New', monospace" font-size="10" fill="#6e7681">
        <tspan x="0" dy="18">▸ Inference:</tspan>
        <tspan fill="#6bcb77"> &lt;1ms</tspan>
      </text>
    </g>
  </g>
  
  <!-- Connection Lines Between Cards -->
  <g stroke="#E6B8FF" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,4">
    <line x1="330" y1="170" x2="360" y2="170">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
    </line>
    <line x1="640" y1="170" x2="670" y2="170">
      <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite" begin="1s"/>
    </line>
  </g>
</svg>

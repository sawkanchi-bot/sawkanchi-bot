<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="frontendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="100%" style="stop-color:#c49ee0"/>
    </linearGradient>
    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8D4FF"/>
      <stop offset="100%" style="stop-color:#9cb8e0"/>
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#e0a0b8"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8FFD4"/>
      <stop offset="100%" style="stop-color:#98d4b8"/>
    </linearGradient>
    
    <!-- Filters -->
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  
  <!-- Background Stars -->
  <g fill="#ffffff" opacity="0.3">
    <circle cx="50" cy="50" r="1"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="120" r="0.8"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="850" cy="80" r="1"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="200" r="0.8"><animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="100" cy="450" r="1"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="500" r="0.8"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.5s" repeatCount="indefinite" begin="1.5s"/></circle>
    <circle cx="500" cy="30" r="1"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="500" cy="570" r="0.8"><animate attributeName="opacity" values="0.3;0.5;0.3" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  
  <!-- Central Hub -->
  <g transform="translate(500, 300)">
    <!-- Outer Orbit Ring -->
    <ellipse rx="350" ry="200" fill="none" stroke="#E6B8FF" stroke-width="0.5" opacity="0.15" stroke-dasharray="10,10">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="120s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="280" ry="160" fill="none" stroke="#FFB8D4" stroke-width="0.5" opacity="0.15" stroke-dasharray="8,8">
      <animateTransform attributeName="transform" type="rotate" values="360;0" dur="90s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Core Node -->
    <circle r="50" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="2" filter="url(#nodeGlow)">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E6B8FF" font-weight="bold">CORE</text>
    
    <!-- Core Pulse -->
    <circle r="50" fill="none" stroke="#E6B8FF" stroke-width="1">
      <animate attributeName="r" values="50;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- ═══════════════════════════════════════════════════════════════════
       FRONTEND CLUSTER (Left Side)
       ═══════════════════════════════════════════════════════════════════ -->
  
  <!-- Frontend Main Node -->
  <g transform="translate(150, 150)" filter="url(#nodeGlow)">
    <circle r="35" fill="#1a1a2e" stroke="url(#frontendGrad)" stroke-width="2">
      <animate attributeName="r" values="35;38;35" dur="5s" repeatCount="indefinite"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E6B8FF">FRONTEND</text>
  </g>
  
  <!-- Frontend Sub-nodes -->
  <g transform="translate(80, 80)">
    <circle r="18" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#E6B8FF">React</text>
  </g>
  
  <g transform="translate(220, 70)">
    <circle r="18" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#E6B8FF">Next.js</text>
  </g>
  
  <g transform="translate(70, 180)">
    <circle r="16" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#E6B8FF">TypeScript</text>
  </g>
  
  <g transform="translate(240, 200)">
    <circle r="15" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#E6B8FF">Tailwind</text>
  </g>
  
  <!-- Frontend Connections -->
  <g stroke="#E6B8FF" stroke-width="0.8" opacity="0.4" filter="url(#lineGlow)">
    <line x1="150" y1="150" x2="80" y2="80"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="150" y1="150" x2="220" y2="70"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="150" y1="150" x2="70" y2="180"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="150" y1="150" x2="240" y2="200"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="150" y1="150" x2="500" y2="300"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/></line>
  </g>
  
  <!-- ═══════════════════════════════════════════════════════════════════
       BACKEND CLUSTER (Right Side)
       ═══════════════════════════════════════════════════════════════════ -->
  
  <!-- Backend Main Node -->
  <g transform="translate(850, 150)" filter="url(#nodeGlow)">
    <circle r="35" fill="#1a1a2e" stroke="url(#backendGrad)" stroke-width="2">
      <animate attributeName="r" values="35;38;35" dur="5.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B8D4FF">BACKEND</text>
  </g>
  
  <!-- Backend Sub-nodes -->
  <g transform="translate(920, 80)">
    <circle r="18" fill="#1a1a2e" stroke="#B8D4FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#B8D4FF">Node.js</text>
  </g>
  
  <g transform="translate(780, 70)">
    <circle r="18" fill="#1a1a2e" stroke="#B8D4FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#B8D4FF">Python</text>
  </g>
  
  <g transform="translate(930, 180)">
    <circle r="16" fill="#1a1a2e" stroke="#B8D4FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.2s" repeatCount="indefinite" begin="1.3s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#B8D4FF">PostgreSQL</text>
  </g>
  
  <g transform="translate(760, 200)">
    <circle r="15" fill="#1a1a2e" stroke="#B8D4FF" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#B8D4FF">Redis</text>
  </g>
  
  <!-- Backend Connections -->
  <g stroke="#B8D4FF" stroke-width="0.8" opacity="0.4" filter="url(#lineGlow)">
    <line x1="850" y1="150" x2="920" y2="80"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="850" y1="150" x2="780" y2="70"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="850" y1="150" x2="930" y2="180"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="850" y1="150" x2="760" y2="200"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="850" y1="150" x2="500" y2="300"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/></line>
  </g>
  
  <!-- ═══════════════════════════════════════════════════════════════════
       AI/ML CLUSTER (Bottom Left)
       ═══════════════════════════════════════════════════════════════════ -->
  
  <!-- AI/ML Main Node -->
  <g transform="translate(150, 450)" filter="url(#nodeGlow)">
    <circle r="35" fill="#1a1a2e" stroke="url(#aiGrad)" stroke-width="2">
      <animate attributeName="r" values="35;38;35" dur="4.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FFB8D4">AI / ML</text>
  </g>
  
  <!-- AI/ML Sub-nodes -->
  <g transform="translate(80, 520)">
    <circle r="18" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.2s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#FFB8D4">PyTorch</text>
  </g>
  
  <g transform="translate(220, 530)">
    <circle r="18" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.6s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#FFB8D4">TensorFlow</text>
  </g>
  
  <g transform="translate(70, 420)">
    <circle r="16" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.4s" repeatCount="indefinite" begin="1.4s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#FFB8D4">LangChain</text>
  </g>
  
  <g transform="translate(240, 400)">
    <circle r="15" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.9s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#FFB8D4">OpenAI</text>
  </g>
  
  <!-- AI/ML Connections -->
  <g stroke="#FFB8D4" stroke-width="0.8" opacity="0.4" filter="url(#lineGlow)">
    <line x1="150" y1="450" x2="80" y2="520"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="150" y1="450" x2="220" y2="530"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="150" y1="450" x2="70" y2="420"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="150" y1="450" x2="240" y2="400"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="150" y1="450" x2="500" y2="300"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/></line>
  </g>
  
  <!-- ═══════════════════════════════════════════════════════════════════
       INFRA/TOOLS CLUSTER (Bottom Right)
       ═══════════════════════════════════════════════════════════════════ -->
  
  <!-- Infra Main Node -->
  <g transform="translate(850, 450)" filter="url(#nodeGlow)">
    <circle r="35" fill="#1a1a2e" stroke="url(#infraGrad)" stroke-width="2">
      <animate attributeName="r" values="35;38;35" dur="5.2s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <text y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B8FFD4">INFRA</text>
  </g>
  
  <!-- Infra Sub-nodes -->
  <g transform="translate(920, 520)">
    <circle r="18" fill="#1a1a2e" stroke="#B8FFD4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#B8FFD4">Docker</text>
  </g>
  
  <g transform="translate(780, 530)">
    <circle r="18" fill="#1a1a2e" stroke="#B8FFD4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.7s" repeatCount="indefinite" begin="1.1s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="8" fill="#B8FFD4">AWS</text>
  </g>
  
  <g transform="translate(930, 420)">
    <circle r="16" fill="#1a1a2e" stroke="#B8FFD4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.3s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#B8FFD4">K8s</text>
  </g>
  
  <g transform="translate(760, 400)">
    <circle r="15" fill="#1a1a2e" stroke="#B8FFD4" stroke-width="1" opacity="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.4s" repeatCount="indefinite" begin="2.1s"/>
    </circle>
    <text y="4" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="7" fill="#B8FFD4">CI/CD</text>
  </g>
  
  <!-- Infra Connections -->
  <g stroke="#B8FFD4" stroke-width="0.8" opacity="0.4" filter="url(#lineGlow)">
    <line x1="850" y1="450" x2="920" y2="520"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/></line>
    <line x1="850" y1="450" x2="780" y2="530"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/></line>
    <line x1="850" y1="450" x2="930" y2="420"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/></line>
    <line x1="850" y1="450" x2="760" y2="400"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="4.5s" repeatCount="indefinite"/></line>
    <line x1="850" y1="450" x2="500" y2="300"><animate attributeName="opacity" values="0.1;0.3;0.1" dur="5s" repeatCount="indefinite"/></line>
  </g>
  
  <!-- Traveling Data Particles -->
  <circle r="2.5" fill="#E6B8FF">
    <animateMotion dur="8s" repeatCount="indefinite" path="M 150,150 L 500,300 L 850,150"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#FFB8D4">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 150,450 L 500,300 L 850,450" begin="2s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite" begin="2s"/>
  </circle>
  <circle r="2" fill="#B8D4FF">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 850,150 L 500,300 L 150,450" begin="4s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite" begin="4s"/>
  </circle>
  
  <!-- Legend -->
  <g transform="translate(500, 560)">
    <circle cx="-200" cy="0" r="6" fill="#E6B8FF" opacity="0.8"/>
    <text x="-185" y="4" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">Frontend</text>
    
    <circle cx="-80" cy="0" r="6" fill="#B8D4FF" opacity="0.8"/>
    <text x="-65" y="4" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">Backend</text>
    
    <circle cx="40" cy="0" r="6" fill="#FFB8D4" opacity="0.8"/>
    <text x="55" y="4" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">AI/ML</text>
    
    <circle cx="140" cy="0" r="6" fill="#B8FFD4" opacity="0.8"/>
    <text x="155" y="4" font-family="'Segoe UI', sans-serif" font-size="10" fill="#6e7681">Infrastructure</text>
  </g>
</svg>

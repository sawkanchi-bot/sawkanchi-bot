<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 60" width="400">
  <defs>
    <linearGradient id="sysHGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFB8D4"/>
      <stop offset="50%" style="stop-color:#E6B8FF"/>
      <stop offset="100%" style="stop-color:#B8D4FF"/>
    </linearGradient>
    <filter id="sysGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <line x1="0" y1="30" x2="60" y2="30" stroke="url(#sysHGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="x2" values="40;60;40" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="340" y1="30" x2="400" y2="30" stroke="url(#sysHGrad)" stroke-width="2" opacity="0.6">
    <animate attributeName="x1" values="360;340;360" dur="3s" repeatCount="indefinite"/>
  </line>
  
  <circle cx="70" cy="30" r="3" fill="#FFB8D4" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="330" cy="30" r="3" fill="#B8D4FF" opacity="0.8">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <text x="200" y="38" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="url(#sysHGrad)" filter="url(#sysGlow)" letter-spacing="4">
    ACTIVE SYSTEMS
  </text>
</svg>

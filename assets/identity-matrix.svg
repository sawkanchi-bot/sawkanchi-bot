<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800">
  <defs>
    <linearGradient id="idGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="50%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#B8D4FF"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="textClip1">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width" values="0;800" dur="4s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="textClip2">
      <rect x="0" y="60" width="0" height="60">
        <animate attributeName="width" values="0;0;800" dur="6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  
  <!-- Background Subtle Glow -->
  <rect width="100%" height="100%" fill="#0d1117"/>
  <ellipse cx="400" cy="60" rx="350" ry="50" fill="#E6B8FF" opacity="0.03">
    <animate attributeName="opacity" values="0.03;0.06;0.03" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Terminal Brackets -->
  <text x="30" y="50" font-family="'Courier New', monospace" font-size="24" fill="#4a4a6a" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3s" repeatCount="indefinite"/>
    &gt;_
  </text>
  
  <!-- Main Text Line 1 -->
  <g clip-path="url(#textClip1)">
    <text x="80" y="50" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="url(#idGrad)" filter="url(#textGlow)">
      Designing scalable architectures that think.
    </text>
  </g>
  
  <!-- Main Text Line 2 -->
  <g clip-path="url(#textClip2)">
    <text x="80" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#B8D4FF" opacity="0.8">
      Full-stack systems  ◆  AI pipelines  ◆  Intelligent automation
    </text>
  </g>
  
  <!-- Cursor -->
  <rect x="80" y="30" width="12" height="28" fill="#FFB8D4">
    <animate attributeName="x" values="80;560;560" dur="4s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1;0;0" dur="1s" repeatCount="indefinite" begin="4s"/>
  </rect>
  
  <!-- Side Accent -->
  <line x1="750" y1="20" x2="750" y2="100" stroke="#2d1f3d" stroke-width="2" opacity="0.5"/>
  <line x1="750" y1="20" x2="750" y2="20" stroke="url(#idGrad)" stroke-width="2">
    <animate attributeName="y2" values="20;100" dur="1s" begin="5s" fill="freeze"/>
  </line>
</svg>

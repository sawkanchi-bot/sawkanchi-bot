<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900">
  <defs>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="100%" style="stop-color:#c49ee0"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#e0a0b8"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8D4FF"/>
      <stop offset="100%" style="stop-color:#9cb8e0"/>
    </linearGradient>
  </defs>
  
  <!-- Main Container -->
  <rect x="2" y="2" width="896" height="396" rx="12" fill="url(#sysGrad)" stroke="url(#borderGrad)" stroke-width="1"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="860" height="40" rx="6" fill="#1a1a2e" opacity="0.8"/>
  <circle cx="45" cy="40" r="6" fill="#ff6b6b" opacity="0.8"/>
  <circle cx="70" cy="40" r="6" fill="#ffd93d" opacity="0.8"/>
  <circle cx="95" cy="40" r="6" fill="#6bcb77" opacity="0.8"/>
  <text x="450" y="46" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#E6B8FF" letter-spacing="3">
    SYSTEM_OVERVIEW.exe
  </text>
  
  <!-- Status Indicator -->
  <circle cx="840" cy="40" r="5" fill="#6bcb77">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="820" y="44" text-anchor="end" font-family="'Courier New', monospace" font-size="10" fill="#6bcb77">ONLINE</text>
  
  <!-- Core Module - Center -->
  <g transform="translate(450, 220)">
    <!-- Outer Ring -->
    <circle r="70" fill="none" stroke="url(#nodeGrad1)" stroke-width="2" opacity="0.3">
      <animate attributeName="r" values="70;75;70" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.5;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Ring -->
    <circle r="55" fill="none" stroke="url(#nodeGrad2)" stroke-width="1" stroke-dasharray="5,5">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <!-- Core -->
    <circle r="40" fill="#1a1a2e" stroke="url(#nodeGrad1)" stroke-width="2"/>
    <text y="5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E6B8FF">CORE</text>
    
    <!-- Pulse Effect -->
    <circle r="40" fill="none" stroke="#E6B8FF" stroke-width="1" opacity="0">
      <animate attributeName="r" values="40;80" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Module 1: Full-Stack Architecture -->
  <g transform="translate(150, 150)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#1a1a2e" stroke="url(#nodeGrad1)" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E6B8FF">FULL-STACK</text>
    <text y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E6B8FF">ARCHITECTURES</text>
    <text y="25" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6bcb77">● ACTIVE</text>
    <!-- Connection Line -->
    <line x1="80" y1="0" x2="200" y2="70" stroke="#E6B8FF" stroke-width="1" opacity="0.3" stroke-dasharray="4,4">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Module 2: AI Agents -->
  <g transform="translate(150, 290)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#1a1a2e" stroke="url(#nodeGrad2)" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FFB8D4">AI AGENTS</text>
    <text y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#FFB8D4">&amp; ML PIPELINES</text>
    <text y="25" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6bcb77">● ACTIVE</text>
    <!-- Connection Line -->
    <line x1="80" y1="0" x2="200" y2="-70" stroke="#FFB8D4" stroke-width="1" opacity="0.3" stroke-dasharray="4,4">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Module 3: Scalable APIs -->
  <g transform="translate(750, 150)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#1a1a2e" stroke="url(#nodeGrad3)" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B8D4FF">SCALABLE APIs</text>
    <text y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#B8D4FF">&amp; MICROSERVICES</text>
    <text y="25" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6bcb77">● ACTIVE</text>
    <!-- Connection Line -->
    <line x1="-80" y1="0" x2="-200" y2="70" stroke="#B8D4FF" stroke-width="1" opacity="0.3" stroke-dasharray="4,4">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.8s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Module 4: Automation Systems -->
  <g transform="translate(750, 290)">
    <rect x="-80" y="-35" width="160" height="70" rx="8" fill="#1a1a2e" stroke="url(#nodeGrad1)" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E6B8FF">AUTOMATION</text>
    <text y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#E6B8FF">SYSTEMS</text>
    <text y="25" text-anchor="middle" font-family="'Courier New', monospace" font-size="9" fill="#6bcb77">● ACTIVE</text>
    <!-- Connection Line -->
    <line x1="-80" y1="0" x2="-200" y2="-70" stroke="#E6B8FF" stroke-width="1" opacity="0.3" stroke-dasharray="4,4">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Data Flow Particles -->
  <circle r="3" fill="#E6B8FF" opacity="0.8">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 150,150 Q 300,180 380,220"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="3" fill="#FFB8D4" opacity="0.8">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 150,290 Q 300,260 380,220" begin="1s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle r="3" fill="#B8D4FF" opacity="0.8">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 750,150 Q 600,180 520,220" begin="0.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle r="3" fill="#E6B8FF" opacity="0.8">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 750,290 Q 600,260 520,220" begin="1.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Footer Stats -->
  <g transform="translate(0, 370)">
    <line x1="20" y1="0" x2="880" y2="0" stroke="#2d1f3d" stroke-width="1"/>
    <text x="100" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6e7681">UPTIME: 99.9%</text>
    <text x="300" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6e7681">MODULES: 4 ACTIVE</text>
    <text x="500" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6e7681">LATENCY: &lt;50ms</text>
    <text x="700" y="20" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#6e7681">STATUS: OPERATIONAL</text>
  </g>
</svg>

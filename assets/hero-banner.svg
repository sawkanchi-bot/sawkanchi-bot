<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <!-- Animated Gradient Background -->
    <linearGradient id="cosmicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a">
        <animate attributeName="stop-color" 
          values="#0d0d1a;#1a1a2e;#16213e;#0d0d1a" 
          dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#1a1a2e">
        <animate attributeName="stop-color" 
          values="#1a1a2e;#2d1f3d;#1a1a2e;#16213e" 
          dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#16213e">
        <animate attributeName="stop-color" 
          values="#16213e;#0d0d1a;#2d1f3d;#16213e" 
          dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Intense Glow for Stars -->
    <filter id="starGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Aurora Gradient -->
    <linearGradient id="auroraGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.3;0.1" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.15">
        <animate attributeName="stop-opacity" values="0.15;0.25;0.15" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0.1">
        <animate attributeName="stop-opacity" values="0.1;0.2;0.1" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="nameGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF">
        <animate attributeName="stop-color" values="#E6B8FF;#FFB8D4;#B8D4FF;#E6B8FF" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FFB8D4">
        <animate attributeName="stop-color" values="#FFB8D4;#B8D4FF;#E6B8FF;#FFB8D4" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#B8D4FF">
        <animate attributeName="stop-color" values="#B8D4FF;#E6B8FF;#FFB8D4;#B8D4FF" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    
    <!-- Radial Glow for Center -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#E6B8FF;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#cosmicGradient)"/>
  
  <!-- Aurora Effect Layer -->
  <ellipse cx="600" cy="500" rx="800" ry="400" fill="url(#auroraGrad)">
    <animate attributeName="rx" values="800;900;800" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="ry" values="400;450;400" dur="12s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Center Glow -->
  <ellipse cx="600" cy="200" rx="400" ry="200" fill="url(#centerGlow)">
    <animate attributeName="rx" values="400;450;400" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="8s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Floating Stars Layer 1 - Small Distant -->
  <g fill="#ffffff" filter="url(#starGlow)">
    <!-- Row 1 -->
    <circle cx="50" cy="30" r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="30;25;30" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="80" r="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="cy" values="80;75;80" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="45" r="1.2">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="cy" values="45;40;45" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="380" cy="90" r="0.7">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="520" cy="35" r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.2s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="cy" values="35;30;35" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="70" r="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.8s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <circle cx="800" cy="25" r="1.1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.2s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="cy" values="25;20;25" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="85" r="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4.5s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <circle cx="1050" cy="40" r="1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite" begin="0.6s"/>
      <animate attributeName="cy" values="40;35;40" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="75" r="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" begin="1.8s"/>
    </circle>
    
    <!-- Row 2 -->
    <circle cx="80" cy="150" r="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3.3s" repeatCount="indefinite" begin="0.4s"/>
    </circle>
    <circle cx="200" cy="180" r="1.1">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4.1s" repeatCount="indefinite" begin="1.1s"/>
      <animate attributeName="cy" values="180;175;180" dur="11s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1000" cy="160" r="0.8">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.7s" repeatCount="indefinite" begin="0.9s"/>
    </circle>
    <circle cx="1120" cy="140" r="1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.3s" repeatCount="indefinite" begin="1.4s"/>
      <animate attributeName="cy" values="140;135;140" dur="8s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Row 3 -->
    <circle cx="100" cy="280" r="1.2">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.9s" repeatCount="indefinite" begin="0.7s"/>
      <animate attributeName="cy" values="280;275;280" dur="10s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="320" r="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.4s" repeatCount="indefinite" begin="1.6s"/>
    </circle>
    <circle cx="980" cy="290" r="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.4s" repeatCount="indefinite" begin="0.2s"/>
    </circle>
    <circle cx="1100" cy="340" r="1.1">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.1s" repeatCount="indefinite" begin="1.3s"/>
      <animate attributeName="cy" values="340;335;340" dur="9s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Bottom Row -->
    <circle cx="60" cy="370" r="0.8">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="180" cy="380" r="1">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite" begin="1.9s"/>
    </circle>
    <circle cx="350" cy="360" r="0.9">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="850" cy="370" r="1.1">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="1020" cy="385" r="0.7">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.6s" repeatCount="indefinite" begin="1.7s"/>
    </circle>
    <circle cx="1140" cy="365" r="0.9">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4.1s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>
  
  <!-- Floating Stars Layer 2 - Medium Colored -->
  <g filter="url(#starGlow)">
    <circle cx="120" cy="120" r="1.5" fill="#E6B8FF">
      <animate attributeName="opacity" values="0.4;0.9;0.4" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5;2;1.5" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="60" r="1.3" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.5;0.95;0.5" dur="4.5s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="r" values="1.3;1.8;1.3" dur="4.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="750" cy="100" r="1.6" fill="#B8D4FF">
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="5.5s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="1.6;2.1;1.6" dur="5.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="1080" cy="120" r="1.4" fill="#E6B8FF">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.8s" repeatCount="indefinite" begin="1.5s"/>
      <animate attributeName="r" values="1.4;1.9;1.4" dur="4.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <circle cx="300" cy="330" r="1.5" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.4;0.85;0.4" dur="5.2s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="r" values="1.5;2;1.5" dur="5.2s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="900" cy="350" r="1.3" fill="#B8D4FF">
      <animate attributeName="opacity" values="0.5;0.9;0.5" dur="4.6s" repeatCount="indefinite" begin="0.8s"/>
      <animate attributeName="r" values="1.3;1.8;1.3" dur="4.6s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
  </g>
  
  <!-- Constellation Lines - Subtle -->
  <g stroke="#E6B8FF" stroke-width="0.5" fill="none" opacity="0.2">
    <path d="M 120 120 L 200 180 L 280 45">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 1080 120 L 1000 160 L 920 85">
      <animate attributeName="opacity" values="0.1;0.3;0.1" dur="9s" repeatCount="indefinite" begin="1s"/>
    </path>
    <path d="M 750 100 L 800 25 L 680 70">
      <animate attributeName="opacity" values="0.1;0.25;0.1" dur="7s" repeatCount="indefinite" begin="2s"/>
    </path>
  </g>
  
  <!-- Orbiting Particle -->
  <circle r="2" fill="#FFB8D4" filter="url(#starGlow)">
    <animateMotion dur="20s" repeatCount="indefinite">
      <mpath href="#orbitPath"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="20s" repeatCount="indefinite"/>
  </circle>
  <path id="orbitPath" d="M 600 200 A 400 150 0 1 1 600 201 Z" fill="none"/>
  
  <!-- Second Orbiting Particle -->
  <circle r="1.5" fill="#B8D4FF" filter="url(#starGlow)">
    <animateMotion dur="25s" repeatCount="indefinite" begin="-10s">
      <mpath href="#orbitPath2"/>
    </animateMotion>
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="25s" repeatCount="indefinite"/>
  </circle>
  <path id="orbitPath2" d="M 600 200 A 350 120 0 1 0 600 201 Z" fill="none"/>
  
  <!-- Main Name Text -->
  <text x="600" y="170" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="300" fill="url(#nameGradient)" filter="url(#softGlow)" letter-spacing="12">
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    KANCHI KUMARI
  </text>
  
  <!-- Subtitle with fade-in -->
  <text x="600" y="220" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#B8D4FF" letter-spacing="6" opacity="0">
    <animate attributeName="opacity" values="0;0;0.8" dur="3s" fill="freeze"/>
    FULL-STACK ENGINEER  •  AI/ML DEVELOPER
  </text>
  
  <!-- Tagline with delayed fade -->
  <text x="600" y="260" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#E6B8FF" letter-spacing="3" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.6" dur="4s" fill="freeze"/>
    <animate attributeName="opacity" values="0.6;0.8;0.6" dur="4s" repeatCount="indefinite" begin="4s"/>
    ARCHITECTING INTELLIGENT SYSTEMS  ◇  SCALING POSSIBILITIES
  </text>
  
  <!-- Decorative Lines -->
  <line x1="350" y1="290" x2="480" y2="290" stroke="url(#nameGradient)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.4" dur="4.5s" fill="freeze"/>
    <animate attributeName="x1" values="480;350" dur="1s" begin="3.5s" fill="freeze"/>
  </line>
  <line x1="720" y1="290" x2="850" y2="290" stroke="url(#nameGradient)" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.4" dur="4.5s" fill="freeze"/>
    <animate attributeName="x2" values="720;850" dur="1s" begin="3.5s" fill="freeze"/>
  </line>
  
  <!-- Central Diamond -->
  <polygon points="600,280 610,290 600,300 590,290" fill="none" stroke="#FFB8D4" stroke-width="1" opacity="0">
    <animate attributeName="opacity" values="0;0;0;0.6" dur="4.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="3s" repeatCount="indefinite" begin="4.5s"/>
  </polygon>
  
  <!-- Bottom Accent Line -->
  <line x1="200" y1="360" x2="1000" y2="360" stroke="#2d1f3d" stroke-width="1" opacity="0.5"/>
  <line x1="200" y1="360" x2="200" y2="360" stroke="url(#nameGradient)" stroke-width="2">
    <animate attributeName="x2" values="200;1000" dur="2s" begin="3s" fill="freeze"/>
    <animate attributeName="opacity" values="0;0.6" dur="2s" begin="3s" fill="freeze"/>
  </line>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="100%">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0.1"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0.1"/>
    </linearGradient>
    <linearGradient id="waveStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="50%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#B8D4FF"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Wave Path -->
  <path d="M 0 60 Q 125 30, 250 50 T 500 45 T 750 55 T 1000 40" fill="none" stroke="url(#waveStroke)" stroke-width="2" opacity="0.6">
    <animate attributeName="d" 
      values="M 0 60 Q 125 30, 250 50 T 500 45 T 750 55 T 1000 40;
              M 0 50 Q 125 60, 250 40 T 500 55 T 750 45 T 1000 55;
              M 0 60 Q 125 30, 250 50 T 500 45 T 750 55 T 1000 40" 
      dur="8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Wave Fill -->
  <path d="M 0 60 Q 125 30, 250 50 T 500 45 T 750 55 T 1000 40 L 1000 80 L 0 80 Z" fill="url(#waveGrad)">
    <animate attributeName="d" 
      values="M 0 60 Q 125 30, 250 50 T 500 45 T 750 55 T 1000 40 L 1000 80 L 0 80 Z;
              M 0 50 Q 125 60, 250 40 T 500 55 T 750 45 T 1000 55 L 1000 80 L 0 80 Z;
              M 0 60 Q 125 30, 250 50 T 500 45 T 750 55 T 1000 40 L 1000 80 L 0 80 Z" 
      dur="8s" repeatCount="indefinite"/>
  </path>
  
  <!-- Floating Particles on Wave -->
  <circle r="3" fill="#E6B8FF" opacity="0.8">
    <animate attributeName="cx" values="0;1000" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="50;40;55;45;50" dur="15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="15s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#FFB8D4" opacity="0.8">
    <animate attributeName="cx" values="0;1000" dur="12s" repeatCount="indefinite" begin="5s"/>
    <animate attributeName="cy" values="55;45;50;55" dur="12s" repeatCount="indefinite" begin="5s"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0" dur="12s" repeatCount="indefinite" begin="5s"/>
  </circle>
</svg>

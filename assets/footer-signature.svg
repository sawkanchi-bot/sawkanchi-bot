<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="100%">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Top Line -->
  <line x1="100" y1="20" x2="900" y2="20" stroke="url(#footGrad)" stroke-width="1">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Signature Text -->
  <text x="500" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#6e7681" letter-spacing="2">
    CRAFTED WITH PRECISION • DESIGNED FOR IMPACT
  </text>
  
  <!-- Signature Diamond -->
  <g transform="translate(500, 85)" filter="url(#footGlow)">
    <polygon points="0,-8 8,0 0,8 -8,0" fill="none" stroke="#FFB8D4" stroke-width="1">
      <animate attributeName="stroke-opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <circle r="2" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Side Accents -->
  <circle cx="200" cy="85" r="2" fill="#E6B8FF" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="85" r="2" fill="#B8D4FF" opacity="0.5">
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
  
  <!-- Year Signature -->
  <text x="500" y="110" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#4a4a6a">
    © 2024 KANCHI KUMARI
  </text>
</svg>
